<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラーメモリー - 短時間暇つぶしゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 カラーメモリー</h1>
            <p class="subtitle">色の順番を覚えよう！</p>
        </header>

        <!-- モード選択画面 -->
        <div class="mode-selection" id="modeSelection">
            <h2>ゲームモードを選択</h2>
            <div class="mode-buttons">
                <button class="mode-btn" id="singlePlayerBtn">
                    <span class="mode-icon">👤</span>
                    <span class="mode-title">1人プレイ</span>
                    <span class="mode-desc">自分のベストを目指す</span>
                </button>
                <button class="mode-btn" id="multiPlayerBtn">
                    <span class="mode-icon">👥</span>
                    <span class="mode-title">みんなでプレイ</span>
                    <span class="mode-desc">交代で競い合おう</span>
                </button>
            </div>
        </div>

        <!-- 難易度選択画面 -->
        <div class="difficulty-selection" id="difficultySelection" style="display: none;">
            <h2>難易度を選択</h2>
            <div class="difficulty-buttons">
                <button class="difficulty-btn easy" data-difficulty="easy">
                    <span class="difficulty-icon">😊</span>
                    <span class="difficulty-title">イージー</span>
                    <span class="difficulty-desc">10ラウンド・4色・ゆっくり</span>
                </button>
                <button class="difficulty-btn normal" data-difficulty="normal">
                    <span class="difficulty-icon">🙂</span>
                    <span class="difficulty-title">ノーマル</span>
                    <span class="difficulty-desc">15ラウンド・4色・普通</span>
                </button>
                <button class="difficulty-btn hard" data-difficulty="hard">
                    <span class="difficulty-icon">😤</span>
                    <span class="difficulty-title">ハード</span>
                    <span class="difficulty-desc">20ラウンド・6色・速い</span>
                </button>
            </div>
            <button class="btn btn-back" id="backToModeFromDifficultyBtn">戻る</button>
        </div>

        <!-- プレイヤー設定画面 -->
        <div class="player-setup" id="playerSetup" style="display: none;">
            <h2>プレイヤー設定</h2>
            <div class="player-count">
                <label>人数を選択:</label>
                <select id="playerCount">
                    <option value="2">2人</option>
                    <option value="3">3人</option>
                    <option value="4">4人</option>
                </select>
            </div>
            <div class="player-names" id="playerNames"></div>
            <button class="btn btn-start" id="startMultiplayerBtn">ゲーム開始</button>
            <button class="btn btn-back" id="backToModeBtn">戻る</button>
        </div>

        <!-- ゲーム画面 -->
        <div class="game-screen" id="gameScreen" style="display: none;">
            <!-- 現在のプレイヤー表示 -->
            <div class="current-player" id="currentPlayerDisplay" style="display: none;">
                <span class="player-label">プレイヤー:</span>
                <span class="player-name" id="currentPlayerName"></span>
            </div>

            <div class="game-info">
                <div class="info-item">
                    <span class="label">ラウンド</span>
                    <span class="value" id="round">1</span>
                </div>
                <div class="info-item">
                    <span class="label">スコア</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="info-item">
                    <span class="label">最高記録</span>
                    <span class="value" id="highscore">0</span>
                </div>
            </div>

            <div class="message" id="message">スタートを押してね！</div>

            <div class="color-grid" id="colorGrid">
                <button class="color-button red" data-color="red"></button>
                <button class="color-button blue" data-color="blue"></button>
                <button class="color-button green" data-color="green"></button>
                <button class="color-button yellow" data-color="yellow"></button>
                <button class="color-button purple extra-color" data-color="purple" style="display: none;"></button>
                <button class="color-button orange extra-color" data-color="orange" style="display: none;"></button>
            </div>

            <div class="controls">
                <button class="btn btn-start" id="startBtn">スタート</button>
                <button class="btn btn-reset" id="resetBtn" style="display: none;">もう一度</button>
            </div>

            <!-- リーダーボード（マルチプレイヤー用） -->
            <div class="leaderboard" id="leaderboard" style="display: none;">
                <h3>スコアボード</h3>
                <div class="leaderboard-list" id="leaderboardList"></div>
            </div>

            <div class="game-rules">
                <h3>遊び方</h3>
                <ul>
                    <li>光る色の順番を覚えよう</li>
                    <li>同じ順番で色をタップ</li>
                    <li>ラウンドごとに1色増える</li>
                    <li>10ラウンドでクリア！</li>
                </ul>
                <p class="anti-addiction">⏱️ 短時間で終わる設計で、スマホ依存を防止</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
